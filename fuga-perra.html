g.fillStyle='#d9b77e';g.beginPath();g.arc(cx,cy,40,0,7);g.fill();
doors.forEach((d,i)=>{const p=P(i,1),c=Math.cos(d.a),s=Math.sin(d.a),cl=T<d.until;g.lineWidth=9;
if(cl){g.strokeStyle='#8a3b1f';g.beginPath();g.moveTo(p.x-s*34,p.y+c*34);g.lineTo(p.x+s*34,p.y-c*34);g.stroke();g.strokeStyle='#fff';g.lineWidth=5;g.beginPath();g.arc(p.x,p.y,24,-Math.PI/2,-Math.PI/2+2*Math.PI*(d.until-T)/2000);g.stroke()}
else{g.strokeStyle='#2e8b57';g.beginPath();g.moveTo(p.x-s*34,p.y+c*34);g.lineTo(p.x-s*34+c*30,p.y+c*34+s*30);g.stroke();g.beginPath();g.moveTo(p.x+s*34,p.y-c*34);g.lineTo(p.x+s*34+c*30,p.y-c*34+s*30);g.stroke()}
for(let k=0;k<2;k++){g.fillStyle=d.att>k?'#ffd23f':'rgba(0,0,0,.3)';g.beginPath();g.arc(p.x+c*52+s*(k?9:-9),p.y+s*52-c*(k?9:-9),6,0,7);g.fill()}});
if(toy.on){const p=P(toy.s,toy.t);img(IMG.toy,p.x,p.y,R*.2)}
if(boy.on){const p=P(boy.s,boy.t);img(IMG.boy,p.x,p.y,R*.54)}
if(dog.st!=='wait'||true){const p=P(dog.s,dog.st==='wait'?0:dog.t);if(dog.boost>0){g.fillStyle='rgba(255,230,80,.45)';g.beginPath();g.arc(p.x,p.y,R*.15,0,7);g.fill()}img(IMG.dog,p.x,p.y,R*.34)}
g.restore();
g.fillStyle='#fff';g.font='bold 18px system-ui';g.textAlign='left';g.fillText('Nivel '+level+'   ⭐ '+score,12,30);g.textAlign='right';g.fillText('',W-12,30);
if(T<msgT){g.textAlign='center';g.font='bold 22px system-ui';g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=4;g.strokeText(msg,W/2,64);g.fillText(msg,W/2,64)}}
let last=now();function loop(){const T=now(),dt=Math.min(.05,(T-last)/1000);last=T;if(phase==='play')upd(dt);if(phase==='leaving')dog.t+=dt*1.2;if(phase!=='menu')draw();requestAnimationFrame(loop)}loop();
function near(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearestSpoke(x,y){const a=Math.atan2(y-cy,x-cx);let b=0,bd=9;doors.forEach((d,i)=>{let df=Math.abs(Math.atan2(Math.sin(a-d.a),Math.cos(a-d.a)));if(df<bd){bd=df;b=i}});return b}
cv.addEventListener('pointerdown',e=>{if(phase!=='play')return;const q={x:e.clientX,y:e.clientY};
if(boy.on&&near(q,P(boy.s,boy.t))<R*.27){boy.on=false;boy.next=now()+6000+rnd(4000);say('¡Nene a salvo!');return}if(toy.on&&near(q,P(toy.s,toy.t))<50){drag=toy;return}
let bi=-1,bd=60;doors.forEach((d,i)=>{const a=P(i,1),b=P(i,.5),vx=b.x-a.x,vy=b.y-a.y;let u=((q.x-a.x)*vx+(q.y-a.y)*vy)/(vx*vx+vy*vy);u=Math.max(0,Math.min(1,u));const k=Math.hypot(q.x-a.x-u*vx,q.y-a.y-u*vy);if(k<bd){bd=k;bi=i}});if(bi>=0)doors[bi].until=now()+2000});
cv.addEventListener('pointermove',e=>{if(drag)drag.s=nearestSpoke(e.clientX,e.clientY)});
addEventListener('pointerup',()=>drag=null);
ov.addEventListener('pointerdown',()=>{audio();if(!musicOn){musicOn=true;mi=0;nextT=AC.currentTime+.1}
if(phase==='over'){level=1;score=0;lives=5}else if(phase==='between'){level++}
setup();phase='play';ov.style.display='none'});
</script></body></html>
